<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Nav – navigate</title>
<style>
  :root { --bg:#0e1a24; --ink:#eef3f6; --muted:#9fb3c1; --accent:#ffb02e; --ok:#3ddc84; --bad:#ff5a5a; --panel:#162838; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:620px; margin:0 auto; padding:12px; }
  h1 { font-size:22px; margin:4px 0 6px; }
  p, small { color:var(--muted); }
  button, select { font:600 16px system-ui; border:0; border-radius:10px; min-height:46px; }
  button { padding:10px 14px; background:var(--accent); color:#1b1300; }
  button.sec { background:#22384a; color:var(--ink); }
  button:disabled { opacity:.45; }
  select { background:#0b1520; color:var(--ink); padding:8px 10px; border:1px solid #2b4458; width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .row > * { flex:1 1 140px; }
  .tabs { display:flex; gap:6px; margin:6px 0; }
  .tabs button { flex:1; background:#22384a; color:var(--ink); }
  .tabs button.on { background:var(--accent); color:#1b1300; }
  #camwrap { position:relative; border-radius:12px; overflow:hidden; background:#000; aspect-ratio:3/4; max-height:58vh; margin:0 auto; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #bar { position:absolute; left:0; right:0; top:0; height:6px; background:#0006; }
  #bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .2s; }
  #arrow { position:absolute; left:50%; top:42%; width:150px; height:150px; margin:-75px 0 0 -75px; display:none; transition:transform .15s linear; filter:drop-shadow(0 3px 6px #000a); }
  #plan { position:absolute; top:12px; right:10px; width:150px; height:150px; border-radius:10px; background:#0b1520e6; }
  #walk { position:absolute; top:12px; left:10px; padding:6px 9px; border-radius:8px; background:#0b1520cc; font:600 13px/1.35 system-ui; }
  #instr { position:absolute; left:0; right:0; bottom:0; padding:12px 14px; background:linear-gradient(#0000,#000d); font:700 21px/1.25 system-ui; text-shadow:0 1px 3px #000; }
  #instr small { display:block; font:500 14px system-ui; color:#d6e2ea; }
  .panel { background:var(--panel); border-radius:12px; padding:12px; margin:10px 0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 4px; border-bottom:1px solid #22384a; }
  td.n { text-align:right; white-space:nowrap; }
  #log { max-height:28vh; overflow:auto; font:12px/1.4 ui-monospace, monospace; background:#08121a; padding:10px; border-radius:8px; white-space:pre-wrap; color:#b9cbd6; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Navigate</h1>
  <p id="status">Loading…</p>
  <div class="tabs"><button id="tabRec" class="on">1. Record</button><button id="tabNav">2. Navigate</button></div>

  <div id="camwrap">
    <div id="bar"><i id="barfill"></i></div>
    <video id="cam" playsinline muted></video>
    <svg id="arrow" viewBox="-50 -50 100 100"><path d="M0,-44 L30,4 L11,4 L11,40 L-11,40 L-11,4 L-30,4 Z" fill="#ffb02e" stroke="#1b1300" stroke-width="3"/></svg>
    <canvas id="plan" width="300" height="300"></canvas>
    <div id="walk"></div>
    <div id="instr">Camera off<small></small></div>
  </div>
  <div class="row"><button id="camBtn">Start camera</button></div>

  <section id="recPanel" class="panel">
    <b>Record a view</b>
    <p style="margin:4px 0 8px">Stand in the place, point the phone towards the next place, tap Record and turn slowly a little left and right for 5 s. Record every direction someone can walk from that place.</p>
    <div class="row"><label>I'm in<select id="recPlace"></select></label><label>facing towards<select id="recFacing"></select></label></div>
    <div class="row"><button id="recBtn" disabled>Record 5 s</button></div>
    <table id="lib"></table>
  </section>

  <section id="navPanel" class="panel hidden">
    <b>Where to?</b>
    <div class="row"><select id="dest"></select></div>
    <p id="routeText" style="margin:4px 0"></p>
    <div class="row"><button id="markRight" class="sec">Arrow right</button><button id="markWrong" class="sec">Arrow wrong</button></div>
  </section>

  <section class="panel">
    <b>Library and log</b>
    <div class="row"><button id="exportBtn" class="sec">Save library file</button><button id="importBtn" class="sec">Load library file</button><input id="importFile" type="file" accept=".json" class="hidden"></div>
    <div class="row"><button id="copyLog" class="sec">Copy log</button><button id="clearLog" class="sec">Clear log</button><button id="wipe" class="sec">Delete all views</button></div>
    <div id="log"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
{
const VERSION = 'nav v3';
const $ = id => document.getElementById(id);

// ---------- log ----------
let lines = [];
try { lines = JSON.parse(localStorage.getItem('navLog') || '[]'); } catch (e) {}
function log(m) {
  lines.push(`${new Date().toISOString().slice(11, 19)} ${m}`);
  if (lines.length > 500) lines.splice(0, lines.length - 500);
  try { localStorage.setItem('navLog', JSON.stringify(lines)); } catch (e) {}
  $('log').textContent = lines.slice(-80).join('\n');
}
window.addEventListener('error', e => log(`ERROR ${e.message} @${e.lineno}`));
window.addEventListener('unhandledrejection', e => log(`ERROR ${e.reason}`));
const setStatus = t => $('status').textContent = t;
$('clearLog').onclick = () => { lines = []; log('log cleared'); };
$('copyLog').onclick = async () => {
  const text = [`${VERSION} | model ${modelName} | views: ${libSummary()} | ${navigator.userAgent}`, ...lines].join('\n');
  try { await navigator.clipboard.writeText(text); setStatus('Log copied. Paste it to Claude.'); } catch (e) { setStatus('Copy failed; long-press the log and copy.'); }
};
log(`--- ${VERSION} loaded`);

// ---------- house graph ----------
let G, N = {}, adj = {}, places = [], nameOf = id => (N[id] && N[id].name) || id;
const floorZ = {};
function nodeZ(n) { return n.z != null ? n.z : (floorZ[n.floor] || 0); }
function bearing(a, b) {             // plan bearing, degrees clockwise from north (+y)
  const dx = b.pos[0] - a.pos[0], dy = b.pos[1] - a.pos[1];
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}
async function loadGraph() {
  G = await (await fetch('nav-graph.json', { cache: 'no-cache' })).json();
  G.floors.forEach(f => floorZ[f.id] = f.z);
  G.nodes.forEach(n => { N[n.id] = n; adj[n.id] = []; });
  const link = (a, b, kind) => {
    const A = N[a], B = N[b];
    const d = Math.hypot(B.pos[0] - A.pos[0], B.pos[1] - A.pos[1], nodeZ(B) - nodeZ(A)) * (kind === 'stair' ? 1.5 : 1);
    adj[a].push({ to: b, d, kind }); adj[b].push({ to: a, d, kind });
  };
  G.edges.forEach(([a, b]) => link(a, b, 'walk'));
  G.connectors.forEach(c => c.flights.forEach(f => link(f.from, f.to, 'stair')));
  for (const n of G.nodes) {
    if (n.type === 'stair_landing' && !n.name) n.name = { 'G.stair.bottom': 'Stairs (bottom)', 'S.landing': 'Stair landing', 'F1.stair.top': 'Stairs (top, first floor)' }[n.id] || n.id;
    if ((n.type === 'room' && !n.void) || n.type === 'stair_landing') places.push(n.id);
  }
  N['G.hall'].name = 'Hall (ground)'; N['F1.hall'].name = 'Hall (first floor)';
  ['G.bedroomA', 'G.bedroomB', 'G.wc'].forEach(id => N[id].name += ' (ground)');
  ['F1.bedroomA', 'F1.bedroomB'].forEach(id => N[id].name += ' (first floor)');
}
function isPlace(id) { return places.includes(id); }
// which place a node belongs to: itself if it is a place, else the room whose interior contains it (doors sit in walls -> none)
const placeCache = {};
function placeOf(id) {
  if (id in placeCache) return placeCache[id];
  let res = null;
  if (isPlace(id)) res = id;
  else {
    const n = N[id];
    for (const p of places) {
      const P = N[p];
      if (P.bounds && P.floor === n.floor) {
        const [x0, y0, x1, y1] = P.bounds;
        if (n.pos[0] > x0 && n.pos[0] < x1 && n.pos[1] > y0 && n.pos[1] < y1) { res = p; break; }
      }
    }
  }
  return placeCache[id] = res;
}
// the sequence of places a path passes through (no repeats)
function placesOn(path) { const out = []; for (const id of path) { const p = placeOf(id); if (p && out[out.length - 1] !== p) out.push(p); } return out; }

// shortest path (Dijkstra; tiny graph)
function route(from, to) {
  const dist = { [from]: 0 }, prev = {}, done = new Set();
  while (true) {
    let u = null;
    for (const k in dist) if (!done.has(k) && (u === null || dist[k] < dist[u])) u = k;
    if (u === null) return null;
    if (u === to) break;
    done.add(u);
    for (const e of adj[u]) { const nd = dist[u] + e.d; if (!(e.to in dist) || nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = { from: u, kind: e.kind }; } }
  }
  const path = [to];
  while (path[0] !== from) path.unshift(prev[path[0]].from);
  return { path, dist: dist[to], kinds: path.slice(1).map(p => prev[p].kind) };
}
// places you can walk to next from a place (through doors/waypoints), and the first step towards each
function neighbourPlaces(id) {
  const out = [];
  for (const p of places) {
    if (p === id) continue;
    const r = route(id, p);
    if (r && placesOn(r.path).length === 2) out.push({ place: p, first: r.path[1] });
  }
  return out;
}

// ---------- views library (IndexedDB) ----------
let db, views = [];   // { id, place, facing, heading, vec }
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open('arnav-nav', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('views', { keyPath: 'id', autoIncrement: true });
  r.onsuccess = () => { db = r.result; res(); };
  r.onerror = () => rej(r.error);
});
const store = m => db.transaction('views', m).objectStore('views');
async function loadViews() { await dbReady; views = await new Promise(res => { const q = store('readonly').getAll(); q.onsuccess = () => res(q.result.map(v => ({ ...v, vec: new Float32Array(v.vec) }))); }); }
function addView(place, facing, heading, vec) {
  return new Promise(res => { const q = store('readwrite').add({ place, facing, heading, vec: Array.from(vec), model: modelName }); q.onsuccess = () => { views.push({ id: q.result, place, facing, heading, vec }); res(); }; });
}
const key = v => `${v.place}|${v.facing}`;
function libSummary() { const c = {}; views.forEach(v => c[key(v)] = (c[key(v)] || 0) + 1); return Object.keys(c).length + ' directions, ' + views.length + ' frames'; }
function renderLib() {
  const c = {}; views.forEach(v => c[key(v)] = (c[key(v)] || 0) + 1);
  const rows = Object.entries(c).sort();
  $('lib').innerHTML = rows.length ? rows.map(([k, n]) => { const [p, f] = k.split('|');
    return `<tr><td>${nameOf(p)} → ${nameOf(f)}</td><td class="n">${n}</td><td class="n"><button class="sec" data-k="${k}" style="min-height:34px;padding:4px 10px">Delete</button></td></tr>`; }).join('')
    : '<tr><td>No views recorded yet.</td></tr>';
  $('lib').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const s = store('readwrite'); views.filter(v => key(v) === b.dataset.k).forEach(v => s.delete(v.id));
    views = views.filter(v => key(v) !== b.dataset.k); renderLib(); log(`deleted ${b.dataset.k}`);
  });
}
$('wipe').onclick = () => { store('readwrite').clear(); views = []; renderLib(); log('all views deleted'); };
$('exportBtn').onclick = () => {
  const data = JSON.stringify({ version: VERSION, model: modelName, views: views.map(v => ({ place: v.place, facing: v.facing, heading: v.heading, vec: Array.from(v.vec, x => +x.toFixed(4)) })) });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `nav-library-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  log(`library saved (${views.length} frames)`);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const d = JSON.parse(await f.text());
  if (d.model !== modelName) { setStatus(`File made with ${d.model}, this phone uses ${modelName}. Not loaded.`); return; }
  for (const v of d.views) await addView(v.place, v.facing, v.heading, new Float32Array(v.vec));
  renderLib(); log(`library loaded (${d.views.length} frames)`);
};

// ---------- camera + model ----------
const video = $('cam'); let stream = null, model = null, modelName = 'loading';
$('camBtn').onclick = async () => {
  if (!stream) startOrientation();          // must run inside the tap, before any await
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; $('camBtn').textContent = 'Start camera'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream; await video.play(); $('camBtn').textContent = 'Stop camera'; log('camera on');
  } catch (e) { setStatus(`Camera blocked: ${e.message}`); log(`camera error ${e.message}`); }
};
function normalise(v) { let n = 0; for (const x of v) n += x * x; n = Math.sqrt(n) || 1; for (let i = 0; i < v.length; i++) v[i] /= n; return v; }
async function embed() {
  if (!video.videoWidth || !model) return null;
  const t = tf.tidy(() => model.infer(video, true));
  const v = normalise(new Float32Array(await t.data())); t.dispose(); return v;
}

// ---------- gyroscope heading (relative; corrected at every recognition) ----------
let gyro = null;   // degrees clockwise, arbitrary zero
function headingFrom(a, b, g) {   // W3C compass-heading formula
  const d = Math.PI / 180, x = b * d, y = g * d, z = a * d;
  const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
  const Vx = -cZ * sY - sZ * sX * cY, Vy = -sZ * sY + cZ * sX * cY;
  let h = Math.atan(Vx / Vy);
  if (Vy < 0) h += Math.PI; else if (Vx < 0) h += 2 * Math.PI;
  return h * 180 / Math.PI;
}
// step counter: peaks in total acceleration; ~0.7 m per step
let steps = 0, stepsAtFix = 0, lastStepT = 0, above = false, accSmooth = 9.8;
const STEP_M = 0.7;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const m = Math.hypot(a.x, a.y, a.z);
  accSmooth = accSmooth * 0.7 + m * 0.3;
  const t = performance.now();
  if (!above && accSmooth > 11.0 && t - lastStepT > 320) { steps++; lastStepT = t; above = true; }
  else if (above && accSmooth < 9.9) above = false;
}
let sensorsStarted = false, orientEvents = 0, motionEvents = 0;
function startOrientation() {
  if (sensorsStarted) return; sensorsStarted = true;
  const on = e => { if (e.alpha != null) { gyro = headingFrom(e.alpha, e.beta, e.gamma); orientEvents++; } };
  const mo = e => { motionEvents++; onMotion(e); };
  // listen regardless; permission prompts (where they exist) are requested in the same tap
  window.addEventListener('deviceorientation', on);
  window.addEventListener('devicemotion', mo);
  try { if (DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().then(r => log('orientation permission: ' + r)).catch(e => log('orientation permission error: ' + e.message)); } catch (e) {}
  try { if (DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().then(r => log('motion permission: ' + r)).catch(e => log('motion permission error: ' + e.message)); } catch (e) {}
  setTimeout(() => {
    log(`sensors after 3 s: orientation events ${orientEvents}, motion events ${motionEvents}`);
    if (!orientEvents) setStatus('Motion sensors are blocked: the arrow will not turn with you. In Chrome: Settings → Site settings → Motion sensors → Allow, then reload.');
  }, 3000);
}

// ---------- record ----------
function fillFacing() {
  const opts = neighbourPlaces($('recPlace').value);
  $('recFacing').innerHTML = opts.map(o => `<option value="${o.place}">${nameOf(o.place)}</option>`).join('');
}
let recording = null;
$('recBtn').onclick = () => {
  if (!stream) { setStatus('Start the camera first.'); return; }
  const place = $('recPlace').value, facing = $('recFacing').value;
  const rp = route(place, facing).path;
  const first = rp.find(id => placeOf(id) !== place) || rp[1];
  recording = { place, facing, heading: bearing(N[place], N[first]), until: performance.now() + 5000, n: 0 };
  $('recBtn').disabled = true; log(`recording ${place} → ${facing} (heading ${recording.heading.toFixed(0)}°)`);
};

// ---------- recognise + navigate ----------
let mode = 'rec';
$('tabRec').onclick = () => { mode = 'rec'; $('tabRec').classList.add('on'); $('tabNav').classList.remove('on'); $('recPanel').classList.remove('hidden'); $('navPanel').classList.add('hidden'); $('arrow').style.display = 'none'; };
$('tabNav').onclick = () => { mode = 'nav'; $('tabNav').classList.add('on'); $('tabRec').classList.remove('on'); $('navPanel').classList.remove('hidden'); $('recPanel').classList.add('hidden'); hist.length = 0; log(`--- navigating to ${$('dest').value}`); };
$('dest').onchange = () => { hist.length = 0; arrived = false; log(`--- destination ${$('dest').value}`); };

const hist = [];          // recent best view keys
let here = null;          // { place, facing, heading } last confirmed
let fixGyro = null, fixHeading = null, lastFixAt = 0, arrived = false, lastLogged = '';
const ctx = () => here ? `${here.place} facing ${here.facing}, plan heading ${(currentHeading() ?? -1).toFixed(0)}, gyro ${gyro == null ? 'off' : gyro.toFixed(0)}, steps ${steps} | ${lastLogged}` : 'no fix yet';
$('markRight').onclick = () => log(`USER: arrow RIGHT (${ctx()})`);
$('markWrong').onclick = () => log(`USER: arrow WRONG (${ctx()})`);

function bestView(v) {
  const best = {};
  for (const w of views) {
    if (w.vec.length !== v.length) continue;
    let dot = 0; for (let i = 0; i < v.length; i++) dot += w.vec[i] * v[i];
    const k = key(w); if (!(k in best) || dot > best[k].s) best[k] = { s: dot, w };
  }
  return Object.values(best).sort((a, b) => b.s - a.s);
}
// a recognised place must be the same place, or reachable without passing another recorded place (no teleporting)
function plausible(place) {
  if (!here || place === here.place) return true;
  return neighbourPlaces(here.place).some(o => o.place === place);
}

function navigateStep(v) {
  const r = bestView(v);
  if (!r.length) { $('instr').innerHTML = 'Record views first<small>use the Record tab</small>'; return; }
  hist.push(key(r[0].w)); if (hist.length > 9) hist.shift();
  const votes = {}; hist.forEach(k => votes[k] = (votes[k] || 0) + 1);
  const [winKey, nv] = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  const conf = nv / hist.length;
  $('barfill').style.width = `${Math.round(conf * 100)}%`;
  $('barfill').style.background = conf > 0.7 ? 'var(--ok)' : conf > 0.45 ? 'var(--accent)' : 'var(--bad)';
  const [place, facing] = winKey.split('|');

  // accept a fix: confident, and either plausible or very confident (re-localise after e.g. a restart)
  const sameRoomTurn = here && here.place === place && here.facing !== facing;
  const need = sameRoomTurn ? 0.78 : 0.67;
  if (hist.length >= 5 && (conf >= need && plausible(place) || conf >= 0.89)) {
    const w = views.find(x => key(x) === winKey);
    if (!here || here.place !== place || here.facing !== facing) log(`FIX ${place} facing ${facing} (${Math.round(conf * 100)}%, score ${r[0].s.toFixed(3)})`);
    if (!here || here.place !== place) log(`steps ${steps} total`);
    here = { place, facing, heading: w.heading };
    if (!here || here.place !== place) stepsAtFix = steps;
    fixHeading = w.heading; fixGyro = gyro; lastFixAt = performance.now();
  }
  render();
}

// ---------- 2D floor plan: rooms, route, you (dot + facing cone) ----------
const pc = $('plan').getContext('2d');
function pointAlong(path, metres) {     // walk 'metres' along the route from the current place's centre
  const pts = [N[here.place]].concat(path.slice(1).map(id => N[id]));
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], seg = Math.hypot(b.pos[0] - a.pos[0], b.pos[1] - a.pos[1]);
    if (metres <= seg || i === pts.length - 1) { const f = seg ? Math.min(1, metres / seg) : 0; return { x: a.pos[0] + (b.pos[0] - a.pos[0]) * f, y: a.pos[1] + (b.pos[1] - a.pos[1]) * f, floor: (f < 0.5 ? a : b).floor || a.floor }; }
    metres -= seg;
  }
}
function drawPlan(r, heading) {
  const W = 300, sc = W / 10.6, X = x => 6 + x * sc, Y = y => W - 6 - y * sc;
  const walked = Math.min((steps - stepsAtFix) * STEP_M, r.dist);
  const me = pointAlong(r.path, walked) || { x: N[here.place].pos[0], y: N[here.place].pos[1] };
  const floor = me.floor || N[here.place].floor || 'G';
  pc.clearRect(0, 0, W, W);
  for (const id of places) {
    const n = N[id]; if (!n.bounds || n.floor !== floor) continue;
    const [x0, y0, x1, y1] = n.bounds;
    pc.fillStyle = id === here.place ? '#ffb02e55' : '#1e3446'; pc.strokeStyle = '#4b6a80'; pc.lineWidth = 2;
    pc.fillRect(X(x0), Y(y1), (x1 - x0) * sc, (y1 - y0) * sc); pc.strokeRect(X(x0), Y(y1), (x1 - x0) * sc, (y1 - y0) * sc);
  }
  pc.strokeStyle = '#3ddc84'; pc.lineWidth = 4; pc.beginPath();
  let started = false;
  for (const id of r.path) {
    const n = N[id]; if (n.floor && n.floor !== floor) { started = false; continue; }   // only this floor's part of the route
    started ? pc.lineTo(X(n.pos[0]), Y(n.pos[1])) : pc.moveTo(X(n.pos[0]), Y(n.pos[1])); started = true;
  }
  pc.stroke();
  if (heading != null) {
    const a = (heading - 90) * Math.PI / 180;
    pc.fillStyle = '#ffffff55'; pc.beginPath(); pc.moveTo(X(me.x), Y(me.y));
    pc.arc(X(me.x), Y(me.y), 34, a - 0.5, a + 0.5); pc.closePath(); pc.fill();
  }
  pc.fillStyle = '#fff'; pc.beginPath(); pc.arc(X(me.x), Y(me.y), 8, 0, 7); pc.fill();
  pc.fillStyle = '#9fb3c1'; pc.font = '600 20px system-ui'; pc.fillText(floor === 'F1' ? 'First floor' : 'Ground floor', 10, 24);
}

function currentHeading() {
  if (fixHeading == null) return null;
  if (gyro == null || fixGyro == null) return fixHeading;
  return (fixHeading + (gyro - fixGyro) + 720) % 360;
}

function render() {
  const dest = $('dest').value;
  if (!here) { $('instr').innerHTML = 'Finding where you are…<small>hold the phone up, pointing ahead, and turn slowly</small>'; $('arrow').style.display = 'none'; return; }
  const age = (performance.now() - lastFixAt) / 1000;
  if (here.place === dest) {
    if (!arrived) { log(`ARRIVED ${dest}`); arrived = true; }
    $('instr').innerHTML = `You have arrived<small>${nameOf(dest)}</small>`; $('arrow').style.display = 'none'; return;
  }
  const r = route(here.place, dest);
  if (!r) { $('instr').innerHTML = 'No route'; return; }
  const iNext = Math.max(1, r.path.findIndex(id => placeOf(id) !== here.place));
  const next = N[r.path[iNext]], kind = r.kinds[iNext - 1];
  const nextPlace = placesOn(r.path)[1];
  const h = currentHeading(), b = bearing(N[here.place], next);
  const turn = h == null ? 0 : ((b - h + 540) % 360) - 180;   // -180..180, + = right
  $('arrow').style.display = 'block';
  $('arrow').style.transform = `rotate(${turn}deg)`;
  $('arrow').style.opacity = age > 8 ? 0.4 : 1;
  const verb = kind === 'stair' ? (nodeZ(next) > nodeZ(N[here.place]) ? 'Take the stairs up' : 'Take the stairs down')
    : next.type === 'door' || next.type === 'opening' ? `Go through the door to ${nameOf(nextPlace)}` : `Go to ${nameOf(nextPlace)}`;
  const dir = Math.abs(turn) < 25 ? 'ahead' : Math.abs(turn) > 150 ? 'behind you' : turn > 0 ? 'on your right' : 'on your left';
  $('instr').innerHTML = `${verb}<small>${dir} · ${r.dist.toFixed(0)} m to go${age > 8 ? ' · point the phone ahead to refresh' : ''}</small><small>I think: in ${nameOf(here.place)}, facing ${nameOf(here.facing)}${gyro == null ? ' · sensors off' : ''}</small>`;
  $('routeText').textContent = 'Route: ' + placesOn(r.path).map(nameOf).join(' → ');
  drawPlan(r, h);
  const walked = (steps - stepsAtFix) * STEP_M;
  $('walk').innerHTML = `${steps} steps · ${(steps * STEP_M).toFixed(0)} m walked<br>${Math.max(0, r.dist - walked).toFixed(0)} m to go`;
  const msg = `${here.place}: ${verb}, turn ${turn.toFixed(0)}°`;
  if (msg.split(',')[0] !== lastLogged.split(',')[0]) log(`GUIDE ${msg}`);
  lastLogged = msg;
}

async function loop() {
  const t0 = performance.now();
  if (stream && video.videoWidth && model) {
    const v = await embed();
    if (v && recording) {
      await addView(recording.place, recording.facing, recording.heading, v); recording.n++;
      $('instr').innerHTML = `Recording ${nameOf(recording.place)} → ${nameOf(recording.facing)}<small>${recording.n} frames – turn slowly a little left and right</small>`;
      $('barfill').style.width = `${Math.min(100, (1 - (recording.until - performance.now()) / 5000) * 100)}%`;
      if (performance.now() > recording.until) {
        log(`recorded ${recording.place} → ${recording.facing}: ${recording.n} frames`);
        setStatus(`Saved ${nameOf(recording.place)} → ${nameOf(recording.facing)}.`);
        recording = null; $('recBtn').disabled = false; renderLib();
      }
    } else if (v && mode === 'nav') navigateStep(v);
    else if (!recording) $('instr').innerHTML = 'Ready to record<small>choose where you are and which way you face</small>';
  }
  if (mode === 'nav' && here) render();   // keep the arrow turning with the gyro between recognitions
  setTimeout(loop, Math.max(30, 300 - (performance.now() - t0)));
}

// ---------- start ----------
(async () => {
  await loadGraph();
  const opt = id => `<option value="${id}">${nameOf(id)}</option>`;
  $('recPlace').innerHTML = places.map(opt).join(''); $('recPlace').onchange = fillFacing; fillFacing();
  $('dest').innerHTML = places.map(opt).join(''); $('dest').value = 'F1.bedroomB';
  await loadViews(); renderLib();
  try { model = await mobilenet.load({ version: 2, alpha: 1.0 }); modelName = 'mobilenet_v2_1.0'; log(`model loaded (${tf.getBackend()})`); }
  catch (e) { modelName = 'none'; log(`model failed: ${e.message}`); setStatus('Image model failed to load. Check the internet connection and reload.'); return; }
  setStatus(`Ready. ${libSummary()}.`);
  $('recBtn').disabled = false;
  loop();
})();
}
</script>
</body>
